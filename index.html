<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>WebGIS - Licenças Ambientais</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!-- Marker Cluster CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
  />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
  />
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>
  <div id="app">
    <!-- SIDEBAR -->
    <div id="sidebar">
      <div id="logo-container">
        <img src="img/logo.png" alt="Logo" id="logo-webgis">
      </div>

      <div class="divider"></div>  <!-- LINHA 1 -->

      <h2>Gestão de Licenças - SEINFRA</h2>

      <div class="secao-box">
        <button class="secao-titulo ativo">Filtros ▾</button>
        
        <div class="secao-conteudo aberto">
          <div class="filtros">
            <label for="filtro-status">Filtrar por status:</label>
            <select id="filtro-status">
              <option value="todos">Todos</option>
              <option value="Aprovado">Aprovado</option>
              <option value="Em Análise">Em análise</option>
              <option value="Pendente de documentação">Pendente de documentação</option>
              <option value="A Iniciar">A Iniciar</option>
            </select>
          </div>
          
          <div class="filtros">
            <label for="filtro-validade">Filtrar por validade:</label>
            <select id="filtro-validade">
              <option value="todos">Todas</option>
              <option value="vigentes">Vigentes</option>
              <option value="vencidas">Vencidas</option>
              <option value="30dias">Vencem em até 30 dias</option>
              <option value="90dias">Vencem em até 90 dias</option>
              <option value="sem-data">Sem data de validade</option>
            </select>
          </div>

          <div class="busca">
          <label for="busca-processo">Buscar por processo:</label>
          <input
              id="busca-processo"
              type="text"
              placeholder="Digite o nº do processo..."
            />
          </div>

          <div class="busca">
            <label for="busca-empreendimento">Buscar por empreendimento:</label>
            <input
              id="busca-empreendimento"
              type="text"
              placeholder="Digite o nome do empreendimento..."
            />
          </div>
        </div>
      </div>

      <div class="divider"></div>  <!-- LINHA 3 -->

      <div class="secao-box">
        <button class="secao-titulo">Quadro Resumo ▸</button>

        <div class="secao-conteudo">
          <div id="resumo-status" class="resumo-status">
            <label>Quadro resumo:</label>
            <div class="resumo-item">
              <span class="resumo-label">Aprovadas</span>
              <span id="contador-aprovado" class="resumo-valor">0</span>
            </div>
            <div class="resumo-item">
              <span class="resumo-label">Em análise</span>
              <span id="contador-em-analise" class="resumo-valor">0</span>
            </div>
            <div class="resumo-item">
              <span class="resumo-label">Pendente de documentação</span>
              <span id="contador-pendente" class="resumo-valor">0</span>
            </div>
            <div class="resumo-item">
              <span class="resumo-label">A iniciar</span>
              <span id="contador-a-iniciar" class="resumo-valor">0</span>
            </div>
          </div>
        </div>
      </div>
      
    <div class="divider"></div>

    <div class="secao-box">
      <button class="secao-titulo">Dashboard ▸</button>

      <div class="secao-conteudo">
        <div id="dashboard-box" class="dashboard-box">
          <label>Dashboard</label>
          <canvas id="grafico-status"></canvas>
        </div>
      </div>
    </div>
    
    <div class="divider"></div>  <!-- LINHA 4 -->
    
    <div class="secao-box">
      <button class="secao-titulo ativo">Licenças ▾</button>

      <div class="secao-conteudo aberto">
        <div id="lista-licencas">
        </div>
      </div>
    </div>
  </div>

    <!-- MAPA -->
    <div id="mapa-container">
      <button id="toggle-sidebar" title="Mostrar/ocultar painel">
      ☰
      </button>

      <div id="mapa"></div>
      <div id="coordenadas-mapa">
        Passe o mouse sobre o mapa para ver as coordenadas
      </div>
      <div id="creditos-painel">
        <strong>Elaborado por:</strong> Ger. de Estudos e Projetos (GEREST/SEINFRA) - <strong>Versão 1.1</strong>
      </div>
  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/mapa.js"></script>

</body>
</html>
